[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stategate"
version = "0.1.0"
description = "Deterministic tool guardrails for AI agents: a trusted state that only code can change, plus a tool dependency graph."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mazi Boustani" }]
keywords = ["ai", "agents", "llm", "guardrails", "tool-calling", "openai-agents", "claude-agent-sdk", "safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
openai = ["openai-agents>=0.3"]
claude = ["claude-agent-sdk>=0.1"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
stategate = "stategate.cli:main"

[project.urls]
Homepage = "https://github.com/MBoustani/stategate"
Issues = "https://github.com/MBoustani/stategate/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/stategate"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
