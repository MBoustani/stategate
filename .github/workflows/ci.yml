name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,openai,claude]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Example policy passes its own checks
        run: stategate check examples/refund_policy.yaml
      - name: Offline demo runs
        run: python examples/offline_demo.py
